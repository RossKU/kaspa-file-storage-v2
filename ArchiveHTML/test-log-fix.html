<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Function Fix Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        #systemLog {
            background: #2d2d2d;
            border: 1px solid #3e3e3e;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .log-entry {
            margin-bottom: 5px;
            white-space: pre-wrap;
        }
        .log-time {
            color: #6a9955;
        }
        .log-info {
            color: #9cdcfe;
        }
        .log-error {
            color: #f48771;
        }
        .log-debug {
            color: #b5cea8;
        }
        button {
            margin: 5px;
            padding: 10px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #1177bb;
        }
        .test-section {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #3e3e3e;
        }
        .success {
            color: #4ec9b0;
            font-weight: bold;
        }
        .failure {
            color: #f48771;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Log Function Fix Test - 引数順序修正確認</h1>
    
    <div id="systemLog"></div>
    
    <div class="test-section">
        <h2>修正前の問題パターン（v5.6.9初期）</h2>
        <button onclick="testBrokenPattern()">問題パターンを実行</button>
        <p>期待: エラー詳細が空になる</p>
    </div>
    
    <div class="test-section">
        <h2>修正後のパターン（v5.6.10準備）</h2>
        <button onclick="testFixedPattern()">修正パターンを実行</button>
        <p>期待: エラー詳細が正しく表示される</p>
    </div>
    
    <div class="test-section">
        <h2>実際のエラーパターンテスト</h2>
        <button onclick="testRealWorldError()">WebSocketエラーテスト</button>
        <button onclick="testUserStateLog()">UserStateログテスト</button>
    </div>
    
    <button onclick="clearLog()" style="background: #cc3333;">ログクリア</button>
    
    <div id="results" class="test-section">
        <h2>テスト結果</h2>
        <div id="test-results"></div>
    </div>

    <script>
        // Mock AppState for testing
        window.AppState = {
            history: {
                systemLogs: []
            }
        };
        
        // Include the fixed log function from index.html
        window.log = function log(message, type = 'info', detail = null) {
            const timestamp = new Date();
            const logEntry = {
                timestamp: timestamp.toISOString(),
                time: timestamp.toLocaleTimeString(),
                type: type,
                message: message
            };
            
            // Handle third parameter (detail) if provided
            if (detail !== null) {
                // For objects, try to stringify
                if (typeof detail === 'object') {
                    try {
                        // Pretty print with 2 space indentation
                        const detailStr = JSON.stringify(detail, null, 2);
                        // If it's a single line, append inline
                        if (!detailStr.includes('\n')) {
                            logEntry.message += ' ' + detailStr;
                        } else {
                            // For multi-line, add on new line
                            logEntry.message += '\n' + detailStr;
                        }
                    } catch (e) {
                        // Handle circular references or other stringify errors
                        if (detail instanceof Error) {
                            logEntry.message += ' ' + detail.toString();
                            if (detail.stack) {
                                logEntry.message += '\nStack: ' + detail.stack;
                            }
                        } else {
                            logEntry.message += ' [オブジェクトの文字列化に失敗]';
                        }
                    }
                } else {
                    // For non-objects, just convert to string
                    logEntry.message += ' ' + String(detail);
                }
            }
            
            AppState.history.systemLogs.push(logEntry);
            
            const logContainer = document.getElementById('systemLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            // Escape HTML and preserve newlines for display
            const escapedMessage = logEntry.message
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/\n/g, '<br>');
            entry.innerHTML = `<span class="log-time">[${logEntry.time}]</span> <span class="log-${type}">${escapedMessage}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Return the log entry for testing
            return logEntry;
        }
        
        function testBrokenPattern() {
            const results = [];
            
            // 問題のパターン（引数順序が間違い）
            const error = 'RPC Server (remote error) -> WebSocket disconnected';
            
            // 間違った呼び出し方（detailが2番目）
            const result1 = log(`[DEBUG] エラーオブジェクト:`, error, 'debug');
            results.push({
                test: '間違った引数順序',
                expected: 'エラー詳細が表示される',
                actual: result1.message.includes('WebSocket') ? '成功' : '失敗（エラー詳細なし）',
                pass: false
            });
            
            const result2 = log(`[新方式] エラー詳細:`, error, 'error');
            results.push({
                test: '新方式エラー',
                expected: 'エラー詳細が表示される',
                actual: result2.message.includes('WebSocket') ? '成功' : '失敗（エラー詳細なし）',
                pass: false
            });
            
            showResults(results);
        }
        
        function testFixedPattern() {
            const results = [];
            
            // 修正後のパターン（引数順序が正しい）
            const error = 'RPC Server (remote error) -> WebSocket disconnected';
            
            // 正しい呼び出し方（typeが2番目）
            const result1 = log(`[DEBUG] エラーオブジェクト:`, 'debug', error);
            results.push({
                test: '正しい引数順序',
                expected: 'エラー詳細が表示される',
                actual: result1.message.includes('WebSocket') ? '成功' : '失敗',
                pass: result1.message.includes('WebSocket')
            });
            
            const result2 = log(`[新方式] エラー詳細:`, 'error', error);
            results.push({
                test: '新方式エラー（修正後）',
                expected: 'エラー詳細が表示される',
                actual: result2.message.includes('WebSocket') ? '成功' : '失敗',
                pass: result2.message.includes('WebSocket')
            });
            
            showResults(results);
        }
        
        function testRealWorldError() {
            const results = [];
            
            // 実際のエラーオブジェクト
            const error = new Error('RPC Server (remote error) -> WebSocket disconnected');
            
            // 修正後の呼び出し
            const result = log(`[DEBUG] エラーオブジェクト:`, 'debug', error);
            results.push({
                test: 'Errorオブジェクト',
                expected: 'エラーメッセージとスタックトレース',
                actual: result.message.includes('Error:') && result.message.includes('Stack:') ? '成功' : '失敗',
                pass: result.message.includes('Error:') && result.message.includes('Stack:')
            });
            
            showResults(results);
        }
        
        function testUserStateLog() {
            const results = [];
            
            // UserStateのモック
            const UserState = {
                address: {
                    toString: () => 'kaspatest:qr0lr4ml9fn3chekrqmjdkergxl93l4wrk3dankcgvjq776s9wn9jhtkdksae'
                },
                privateKey: { __wbg_ptr: 3866640 }
            };
            
            // 修正後の呼び出し
            const result1 = log('[DEBUG] UserState before initialization:', 'debug', UserState);
            results.push({
                test: 'UserStateオブジェクト',
                expected: 'UserStateの内容が表示される',
                actual: result1.message.includes('address') && result1.message.includes('privateKey') ? '成功' : '失敗',
                pass: result1.message.includes('address') && result1.message.includes('privateKey')
            });
            
            const result2 = log('[DEBUG] UserState.address set:', 'debug', UserState.address);
            results.push({
                test: 'UserState.address',
                expected: 'アドレスが表示される',
                actual: result2.message.includes('kaspatest:') ? '成功' : '失敗',
                pass: result2.message.includes('kaspatest:')
            });
            
            showResults(results);
        }
        
        function showResults(results) {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = results.map(r => `
                <div>
                    <strong>${r.test}:</strong> 
                    <span class="${r.pass ? 'success' : 'failure'}">${r.actual}</span>
                    (期待: ${r.expected})
                </div>
            `).join('');
        }
        
        function clearLog() {
            document.getElementById('systemLog').innerHTML = '';
            document.getElementById('test-results').innerHTML = '';
            AppState.history.systemLogs = [];
            log('ログをクリアしました', 'info');
        }
        
        // Initial message
        log('Log Function Fix Test Ready', 'info');
        log('修正前後のパターンをテストして、引数順序の修正を確認してください', 'info');
    </script>
</body>
</html>

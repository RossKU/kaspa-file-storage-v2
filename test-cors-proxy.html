<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Proxy Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        .log {
            background: #000;
            padding: 10px;
            border: 1px solid #333;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            color: #f00;
        }
        .success {
            color: #0f0;
        }
        .info {
            color: #0ff;
        }
    </style>
</head>
<body>
    <h1>CORS Proxy Test for Kaspa Nodes</h1>
    
    <div>
        <button onclick="testDirect()">Direct Access (CORS Error Expected)</button>
        <button onclick="testProxy()">Via Proxy (Should Work)</button>
        <button onclick="testMultiple()">Test Multiple Nodes</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        const PROXY_URL = 'http://localhost:8080/';
        const TEST_NODES = [
            'https://jake.kaspa.green/v2/kaspa/mainnet/tls/wrpc/borsh',
            'https://pgui.kaspa.red/v2/kaspa/testnet-10/tls/wrpc/borsh',
            'https://mike.kaspa.red/v2/kaspa/testnet-10/tls/wrpc/borsh',
            'https://jack.kaspa.blue/v2/kaspa/testnet-10/tls/wrpc/borsh'
        ];
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log cleared', 'info');
        }
        
        async function testDirect() {
            log('Testing direct access (expecting CORS error)...', 'info');
            
            try {
                const response = await fetch(TEST_NODES[0], {
                    method: 'GET',
                    mode: 'cors'
                });
                log(`Direct access successful: ${response.status}`, 'success');
            } catch (error) {
                log(`Direct access failed (expected): ${error.message}`, 'error');
            }
        }
        
        async function testProxy() {
            log('Testing proxy access...', 'info');
            
            for (const node of TEST_NODES) {
                try {
                    const proxyUrl = `${PROXY_URL}?url=${encodeURIComponent(node)}`;
                    log(`Trying: ${node}`, 'info');
                    
                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        mode: 'cors'
                    });
                    
                    if (response.ok) {
                        log(`✓ Success via proxy: ${node} - Status: ${response.status}`, 'success');
                    } else {
                        log(`✗ Failed via proxy: ${node} - Status: ${response.status}`, 'error');
                    }
                } catch (error) {
                    log(`✗ Proxy error for ${node}: ${error.message}`, 'error');
                }
            }
        }
        
        async function testMultiple() {
            log('Testing multiple nodes in parallel...', 'info');
            
            const promises = TEST_NODES.map(async (node) => {
                const proxyUrl = `${PROXY_URL}?url=${encodeURIComponent(node)}`;
                const startTime = Date.now();
                
                try {
                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        mode: 'cors',
                        signal: AbortSignal.timeout(5000)
                    });
                    
                    const elapsed = Date.now() - startTime;
                    return {
                        node,
                        status: response.status,
                        elapsed,
                        success: response.ok
                    };
                } catch (error) {
                    const elapsed = Date.now() - startTime;
                    return {
                        node,
                        error: error.message,
                        elapsed,
                        success: false
                    };
                }
            });
            
            const results = await Promise.all(promises);
            
            log('=== Results ===', 'info');
            results.forEach(result => {
                if (result.success) {
                    log(`✓ ${result.node.split('/')[2]} - ${result.elapsed}ms`, 'success');
                } else {
                    log(`✗ ${result.node.split('/')[2]} - ${result.elapsed}ms - ${result.error || `Status: ${result.status}`}`, 'error');
                }
            });
        }
        
        // Initial log
        log('CORS Proxy Test Ready', 'success');
        log(`Proxy URL: ${PROXY_URL}`, 'info');
    </script>
</body>
</html>
